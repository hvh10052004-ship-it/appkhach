<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>App WebStudio — Tạo website trên điện thoại</title>
  <meta name="theme-color" content="#8f7cff" />
  <link rel="icon" href="public/icons/app-khach-192.png" />
  <link rel="apple-touch-icon" href="public/icons/app-khach-192.png" />
  <style>
body:has(.app-stage) {
  background: #0b0f18;
  overflow-x: hidden;
}

body:has(.app-stage)::before,
body:has(.app-stage)::after {
  display: none;
}

.app-stage {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 28px 16px 36px;
  gap: 18px;
}

.app-stage-hint {
  font-size: 13px;
  color: rgba(255, 255, 255, 0.45);
  text-align: center;
}

.app-stage-hint a {
  color: #c4b5fd;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.app-phone {
  --app-bg: #f4f1ec;
  --app-fg: #1a1714;
  --app-muted: #6b645c;
  --app-faint: #9a9288;
  --app-card: #fff;
  --app-soft: #ece6dc;
  --app-line: #efeae3;
  --app-accent: #5b4bdd;
  --app-accent-soft: #c4b5fd;
  --app-muted-2: #c9c0b5;
  --app-preview-img: #ddd7ce;
  width: min(390px, 100%);
  height: min(844px, calc(100dvh - 88px));
  min-height: 640px;
  background: var(--app-bg);
  color: var(--app-fg);
  border-radius: 36px;
  border: 10px solid #161b26;
  box-shadow: 0 0 0 1px #2a3142;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  view-transition-name: app-shell;
}

.app-phone[data-theme="dark"] {
  --app-bg: #14121a;
  --app-fg: #f3efe8;
  --app-muted: #a8a097;
  --app-faint: #7d766e;
  --app-card: #1e1c26;
  --app-soft: #2a2733;
  --app-line: #322e3c;
  --app-accent: #b4a8ff;
  --app-accent-soft: #8b7cf0;
  --app-muted-2: #4a4554;
  --app-preview-img: #2a2733;
}

.app-phone-body {
  flex: 1;
  overflow-x: hidden;
  overflow-y: auto;
  padding: 4px 18px 28px;
  padding-top: max(4px, env(safe-area-inset-top));
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.app-phone-body:not(.is-chat) > * {
  flex-shrink: 0;
}

.app-phone-body.is-chat {
  overflow: hidden;
  padding: 0;
}

.app-phone-body.is-chat > * {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.app-home-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 18px;
}

.app-home-top h1 {
  font-size: 22px;
  line-height: 1.25;
  letter-spacing: -0.03em;
  font-weight: 800;
}

.app-home-top p {
  font-size: 13px;
  color: var(--app-muted);
  margin-top: 4px;
}

.app-avatar {
  width: 40px;
  height: 40px;
  border-radius: 14px;
  background: var(--app-fg);
  color: var(--app-bg);
  display: grid;
  place-items: center;
  font-size: 13px;
  font-weight: 700;
  flex: none;
}

.app-site-card {
  background: var(--app-fg);
  color: var(--app-bg);
  border-radius: 22px;
  padding: 16px;
  margin-bottom: 14px;
}

.app-site-card-head {
  display: flex;
  gap: 12px;
  align-items: center;
}

.app-site-thumb {
  position: relative;
  width: 64px;
  height: 64px;
  border-radius: 14px;
  overflow: hidden;
  flex: none;
  background: #2c2723;
}

.app-site-card h2 {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.app-site-card .app-meta {
  font-size: 12px;
  color: rgba(244, 241, 236, 0.62);
  margin-top: 3px;
}

.app-progress-row {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  margin: 14px 0 8px;
  color: rgba(244, 241, 236, 0.72);
}

.app-progress-track {
  height: 6px;
  border-radius: 99px;
  background: rgba(244, 241, 236, 0.14);
  overflow: hidden;
}

.app-progress-fill {
  width: 62%;
  height: 100%;
  background: #c4b5fd;
  border-radius: 99px;
}

.app-site-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 14px;
}

.app-site-actions.is-center {
  grid-template-columns: 1fr;
  justify-items: center;
}

.app-site-actions.is-center .app-btn {
  min-width: 200px;
  width: min(240px, 100%);
}

.app-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 42px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 600;
  border: 0;
  cursor: pointer;
}

.app-btn-primary {
  background: #c4b5fd;
  color: var(--app-fg);
}

.app-btn-ghost {
  background: rgba(244, 241, 236, 0.1);
  color: var(--app-bg);
}

.app-checks {
  background: var(--app-card);
  border-radius: 18px;
  padding: 6px 4px;
  margin-bottom: 16px;
}

.app-check {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  font-size: 14px;
}

.app-check + .app-check {
  border-top: 1px solid var(--app-line);
}

.app-check-icon {
  width: 32px;
  height: 32px;
  border-radius: 10px;
  flex: none;
  display: grid;
  place-items: center;
  background: var(--app-bg);
  color: var(--app-faint);
  border: 1px solid var(--app-line);
}

.app-check-icon.on {
  background: var(--app-fg);
  color: var(--app-bg);
  border-color: var(--app-fg);
}

.app-check-label {
  flex: 1;
}

.app-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex: none;
  background: var(--app-muted-2);
}

.app-dot.on {
  background: #276749;
}

.app-live {
  background: var(--app-card);
  border-radius: 12px;
  padding: 10px 12px;
  margin-bottom: 12px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.app-live strong {
  font-size: 12px;
}

.app-live span {
  font-size: 11px;
  color: var(--app-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.app-check small {
  color: var(--app-faint);
  font-size: 12px;
}

.app-section-label {
  font-size: 13px;
  font-weight: 700;
  margin: 4px 2px 10px;
}

.app-quick {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 18px;
}

.app-quick a {
  background: var(--app-card);
  border-radius: 16px;
  padding: 12px 8px 11px;
  text-align: center;
  font-size: 12px;
  font-weight: 600;
  color: var(--app-fg);
}

.app-quick-icon {
  width: 32px;
  height: 32px;
  margin: 0 auto 8px;
  border-radius: 10px;
  background: var(--app-soft);
  display: grid;
  place-items: center;
  font-size: 14px;
  font-weight: 800;
  color: var(--app-accent);
}

.app-tabbar {
  flex: none;
  position: relative;
  z-index: 30;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  padding: 8px 4px 14px;
  background: var(--app-card);
  border-top: 1px solid var(--app-line);
}

.app-tab {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  min-height: 48px;
  font-size: 9px;
  font-weight: 600;
  color: var(--app-faint);
  -webkit-tap-highlight-color: rgba(91, 75, 221, 0.2);
}

.app-tab-icon {
  display: grid;
  place-items: center;
  height: 26px;
  width: 26px;
  flex: none;
}

.app-tab-icon svg {
  display: block;
  overflow: visible;
}

.app-tab.is-on {
  color: var(--app-accent);
}

.app-tab.is-on .app-tab-icon {
  color: var(--app-accent);
}

.app-type-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 18px;
}

.app-type-card {
  background: var(--app-card);
  border: 1px solid transparent;
  border-radius: 16px;
  padding: 14px 12px 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-height: 132px;
  color: var(--app-fg);
  text-align: left;
  width: 100%;
  cursor: pointer;
}

.app-type-card.is-on {
  border-color: var(--app-accent);
  box-shadow: 0 0 0 1px var(--app-accent);
}

.app-type-icon {
  width: 32px;
  height: 32px;
  border-radius: 10px;
  background: var(--app-soft);
  color: var(--app-accent);
  display: grid;
  place-items: center;
  margin-bottom: 2px;
}

.app-type-num {
  font-size: 11px;
  font-weight: 700;
  color: var(--app-accent);
  letter-spacing: 0.04em;
}

.app-type-card strong {
  font-size: 13px;
  line-height: 1.3;
  letter-spacing: -0.02em;
}

.app-type-card span:last-child {
  font-size: 11px;
  color: var(--app-muted);
  line-height: 1.4;
}

.app-chips {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  margin-bottom: 14px;
  padding-bottom: 2px;
}

.app-chip {
  flex: none;
  height: 32px;
  padding: 0 12px;
  border-radius: 99px;
  background: var(--app-card);
  font-size: 12px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  color: var(--app-muted);
}

.app-chip.is-on {
  background: var(--app-fg);
  color: var(--app-bg);
}

.app-tpl-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.app-tpl {
  color: var(--app-fg);
}

.app-tpl-img {
  position: relative;
  height: 110px;
  border-radius: 14px;
  overflow: hidden;
  background: var(--app-preview-img);
  margin-bottom: 8px;
}

.app-tpl strong {
  display: block;
  font-size: 13px;
}

.app-tpl span {
  font-size: 11px;
  color: var(--app-muted);
}

.app-soan-page {
  display: flex;
  flex-direction: column;
  gap: 0;
  padding-bottom: 24px;
}

.app-soan-list {
  list-style: none;
  background: var(--app-card);
  border-radius: 18px;
  overflow: visible;
  flex: none;
}

.app-soan-item.is-locked {
  opacity: 0.72;
  pointer-events: none;
}

.app-soan-list li + li {
  border-top: 1px solid var(--app-line);
}

.app-soan-idx {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--app-soft);
  display: grid;
  place-items: center;
  font-size: 12px;
  font-weight: 700;
  color: var(--app-accent);
  flex: none;
}

.app-soan-item div {
  flex: 1;
}

.app-soan-item strong {
  font-size: 14px;
}

.app-soan-item p {
  font-size: 12px;
  color: var(--app-muted);
}

.app-soan-go {
  font-size: 12px;
  font-weight: 700;
  color: var(--app-accent);
}

.app-btn-dark {
  background: var(--app-soft);
  color: var(--app-fg);
}

.app-btn-full {
  width: 100%;
  margin-top: 10px;
}

.app-note {
  font-size: 12px;
  color: var(--app-muted);
  margin: 12px 2px 0;
}

.app-preview {
  background: var(--app-card);
  border-radius: 16px;
  overflow: hidden;
  padding-bottom: 16px;
}

.app-preview-bar {
  display: flex;
  gap: 6px;
  padding: 10px 12px;
  background: var(--app-soft);
}

.app-preview-bar span {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--app-muted-2);
}

.app-preview-hero {
  padding: 18px 16px 8px;
}

.app-preview-hero small {
  font-size: 11px;
  font-weight: 700;
  color: var(--app-accent);
}

.app-preview-hero h2 {
  font-size: 20px;
  letter-spacing: -0.03em;
  margin: 6px 0;
}

.app-preview-hero p {
  font-size: 13px;
  color: var(--app-muted);
}

.app-preview-price {
  display: block;
  margin: 8px 0 4px;
  font-size: 18px;
}

.app-preview-benefits {
  list-style: disc;
  margin: 0 16px 12px 32px;
  font-size: 13px;
}

.app-preview-products {
  list-style: none;
  margin: 0 16px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.app-preview-products li {
  background: var(--app-bg);
  border-radius: 12px;
  padding: 10px 12px;
}

.app-preview-products strong {
  display: block;
  font-size: 13px;
}

.app-preview-products span {
  font-size: 12px;
  color: var(--app-muted);
}

.app-product-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.app-product-card {
  background: var(--app-card);
  border-radius: 16px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.app-product-card .app-field {
  background: var(--app-bg);
}

.app-product-card-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.app-product-remove {
  border: 0;
  background: none;
  color: #9b2c2c;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}

.app-preview-review {
  margin: 0 16px 12px;
  padding: 12px;
  background: var(--app-bg);
  border-radius: 12px;
}

.app-preview-review p {
  font-size: 13px;
  line-height: 1.4;
}

.app-preview-review cite {
  display: block;
  margin-top: 6px;
  font-size: 12px;
  font-style: normal;
  color: var(--app-muted);
}

.app-preview-cta-row {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin: 0 16px 12px;
  font-size: 12px;
  font-weight: 600;
}

.app-preview-cta {
  display: inline-block;
  margin-top: 12px;
  background: var(--app-fg);
  color: var(--app-bg);
  font-size: 12px;
  font-weight: 700;
  padding: 8px 12px;
  border-radius: 10px;
}

.app-preview-row {
  height: 8px;
  margin: 10px 16px;
  border-radius: 99px;
  background: var(--app-soft);
}

.app-preview-row.short {
  width: 55%;
}

.app-avatar {
  text-decoration: none;
}

.app-back {
  display: inline-block;
  font-size: 12px;
  font-weight: 600;
  color: var(--app-accent);
  margin-bottom: 10px;
}

.app-form {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding-bottom: 8px;
}

.app-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 600;
  background: var(--app-card);
  border-radius: 12px;
  padding: 12px 14px;
}

.app-toggle input {
  width: 16px;
  height: 16px;
}

.app-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  background: var(--app-card);
  border-radius: 14px;
  padding: 12px 14px;
}

.app-field span {
  font-size: 12px;
  font-weight: 700;
}

.app-field input,
.app-field textarea,
.app-field select {
  width: 100%;
  border: 1px solid var(--app-line);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 15px;
  background: var(--app-bg);
  color: var(--app-fg);
}

.app-field input::placeholder,
.app-field textarea::placeholder {
  color: var(--app-faint);
  opacity: 1;
}

.app-field textarea {
  resize: vertical;
  min-height: 72px;
  line-height: 1.4;
}

.app-field small {
  font-size: 11px;
  color: var(--app-faint);
  align-self: flex-end;
}

.app-form-error {
  font-size: 13px;
  color: #9b2c2c;
}

.app-form-ok {
  font-size: 13px;
  color: #276749;
}

.app-preview-blocks {
  list-style: none;
  margin: 8px 12px 0;
  border-top: 1px solid var(--app-line);
}

.app-preview-blocks li {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 10px 4px;
  border-bottom: 1px solid var(--app-line);
}

.app-preview-blocks strong {
  font-size: 12px;
}

.app-preview-blocks span {
  font-size: 12px;
  color: var(--app-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.app-preview-blocks li.is-off span {
  color: var(--app-faint);
}

.app-chat-screen {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  padding: 4px 0 0;
}

.app-chat-screen .app-home-top {
  padding: 0 18px;
  margin-bottom: 10px;
}

.app-chat-list {
  flex: 1;
  min-height: 0;
  overflow: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 4px 18px 20px;
  scroll-padding-bottom: 20px;
}

.app-chat-end {
  flex: none;
  height: 12px;
}

.app-bubble {
  align-self: flex-start;
  max-width: 82%;
  background: var(--app-card);
  border-radius: 14px 14px 14px 4px;
  padding: 8px 12px;
}

.app-bubble.mine {
  align-self: flex-end;
  background: var(--app-fg);
  color: var(--app-bg);
  border-radius: 14px 14px 4px 14px;
}

.app-bubble strong {
  display: block;
  font-size: 11px;
  margin-bottom: 2px;
  opacity: 0.7;
}

.app-bubble p {
  margin: 0;
  font-size: 14px;
  line-height: 1.4;
  white-space: pre-wrap;
  word-break: break-word;
}

.app-chat-form {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  flex-shrink: 0;
  margin: 0;
  padding: 10px 12px 12px;
  background: var(--app-bg);
  border-top: 1px solid var(--app-line);
}

.app-chat-form input {
  flex: 1;
  height: 42px;
  border: 0;
  border-radius: 12px;
  padding: 0 12px;
  background: var(--app-card);
  font-size: 14px;
  color: var(--app-fg);
}

.app-chat-form .app-btn {
  flex: none;
  padding: 0 14px;
}

.app-chat-attach {
  height: 42px;
  padding: 0 12px;
  border: 0;
  border-radius: 12px;
  background: var(--app-soft);
  color: var(--app-fg);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  flex: none;
}

.app-chat-form .app-form-error {
  width: 100%;
  margin: 0;
}

.chat-pins {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 0 18px 8px;
}

.chat-pin-chip {
  flex: none;
  border: 0;
  border-radius: 99px;
  background: var(--app-soft);
  color: var(--app-fg);
  font-size: 12px;
  font-weight: 600;
  padding: 6px 10px;
  max-width: 200px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  cursor: pointer;
}

.chat-swipe {
  position: relative;
  width: 100%;
  flex: none;
  overflow-x: hidden;
  overflow-y: visible;
}

.chat-swipe-action {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  width: 48px;
  background: transparent;
  pointer-events: none;
}

.chat-swipe-inner {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  background: var(--app-bg, #f4f1ec);
  touch-action: pan-y;
}

.chat-img {
  display: block;
  max-width: min(220px, 70vw);
  border-radius: 10px;
  margin: 6px 0 4px;
}

.chat-quote {
  display: grid;
  gap: 2px;
  width: 100%;
  text-align: left;
  border: 0;
  border-left: 3px solid #6d8cff;
  background: rgba(15, 18, 28, 0.08);
  border-radius: 0 8px 8px 0;
  padding: 6px 8px;
  margin: 4px 0 6px;
  color: inherit;
  font: inherit;
  cursor: pointer;
}

.chat-quote strong {

.app-phone.is-waving::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 40;
  pointer-events: none;
  background: radial-gradient(
    circle at var(--app-rx) var(--app-ry),
    color-mix(in srgb, var(--app-accent) 32%, transparent) 0%,
    transparent 46%
  );
  animation: app-water-glow 0.9s ease-out forwards;
}

.app-phone.is-waving::after {
  content: "";
  position: absolute;
  left: var(--app-rx);
  top: var(--app-ry);
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 2px solid color-mix(in srgb, var(--app-accent) 80%, white);
  box-shadow:
    0 0 0 10px color-mix(in srgb, var(--app-accent) 22%, transparent),
    0 0 0 22px color-mix(in srgb, var(--app-accent) 10%, transparent);
  transform: translate(-50%, -50%) scale(0.15);
  opacity: 0.95;
  animation: app-water-ring 0.9s cubic-bezier(0.15, 0.7, 0.25, 1) forwards;
  pointer-events: none;
  z-index: 41;
}

.app-phone.is-waving-fill::before {
  content: "";
  position: absolute;
  left: var(--app-rx);
  top: var(--app-ry);
  width: calc(var(--app-rr) * 2);
  height: calc(var(--app-rr) * 2);
  margin: calc(var(--app-rr) * -1) 0 0 calc(var(--app-rr) * -1);
  border-radius: 50%;
  background: var(--wave-fill);
  transform: scale(0);
  animation: app-water-fill 0.72s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
  z-index: 39;
  pointer-events: none;
  inset: auto;
}

@keyframes app-water-glow {
  0% {
    opacity: 0.7;
  }
  100% {
    opacity: 0;
  }
}

@keyframes app-water-ring {
  to {
    transform: translate(-50%, -50%) scale(calc(var(--app-rr) / 9));
    opacity: 0;
  }
}

@keyframes app-water-fill {
  to {
    transform: scale(1);
  }
}

@keyframes app-water-spread {
  from {
    clip-path: circle(0px at var(--app-rx) var(--app-ry));

  to {

      birthday: raw.birthday || "",
      savedTypes: raw.savedTypes && typeof raw.savedTypes === "object" ? raw.savedTypes : {},
      messages: Array.isArray(raw.messages) ? raw.messages : [
        { who: "bot", text: "Chào bạn. App khách đang chạy trên GitHub Pages — soạn nội dung và xem ngay trên điện thoại." }

    return {

      cta: "",

    };
  }
}

function tpl() {
  return TEMPLATES.find((t) => t.id === state.templateId) || TEMPLATES[0];

function checks() {
  return (CHECKS[state.typeId] || CHECKS.landing).map((c) => ({
    ...c,
    done: Boolean(state[c.id === "hero" ? "headline" : c.id])

}
function progress() {
  const list = checks();
  return list.length ? Math.round((list.filter((c) => c.done).length / list.length) * 100) : 0;
}

function route() {
  const id = (location.hash || "#home").slice(1).split("?")[0] || "home";
  if (TABS.some((t) => t.id === id)) return { view: id, tab: id };
  return { view: SUB_TAB[id] ? id : "home", tab: SUB_TAB[id] || "home" };
}
function page() { return route().view; }
function seed() { return SEED[state.typeId] || SEED.landing; }
function val(key) { return state[key] || seed()[key] || ""; }
function go(id) {

function esc(s) {
  return String(s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function resolveApkUrl() {
  let path = location.pathname || "/";
  const last = path.split("/").pop() || "";
  if (!path.endsWith("/") && !/\.[a-z0-9]+$/i.test(last)) path += "/";
  if (!path.endsWith("/")) path = path.replace(/[^/]+$/, "");
  return path + "WebStudio.apk";
}

      <li><strong>4 loại website</strong><span>Landing, công ty, SaaS, bán hàng</span></li>
      <li><strong>Soạn theo khối</strong><span>Điền chữ, giá, SĐT/Zalo rồi lưu</span></li>
      <li><strong>Xem trước</strong><span>Tab Xem hiện đúng loại bạn đã soạn</span></li>
      <li><strong>Chat</strong><span>Tin nhắn lưu trên thiết bị</span></li>
    </ul>
    <p class="app-info-foot">Phiên bản 1.0 · © 2026 WebStudio</p>`;
}

function renderTaiApk() {
  return `
    <button type="button" class="app-back" data-go="toi">← Cài đặt</button>
    <header class="app-home-top"><div><h1>Tải ứng dụng</h1><p>Cài WebStudio trên Android</p></div></header>
    <a class="app-btn app-btn-primary" id="dlApk" href="WebStudio.apk" download="WebStudio.apk">Tải ứng dụng Android</a>
    <p class="app-note" id="dlHint" style="margin-top:12px">File WebStudio.apk phải nằm cùng thư mục với index.html trên GitHub.</p>`;
}

function bind() {
  document.querySelectorAll("[data-go]").forEach((el) => el.addEventListener("click", () => go(el.dataset.go)));
  document.querySelectorAll("[data-type]").forEach((el) => el.addEventListener("click", () => {
    state.typeId = el.dataset.type;
    state.templateId = TYPE_TEMPLATE[state.typeId];
    save(state); render();
  }));
  document.querySelectorAll("[data-filter]").forEach((el) => {
    el.addEventListener("click", () => { state.filterType = el.dataset.filter || ""; render(); });
  });
  document.querySelectorAll("[data-mau]").forEach((el) => el.addEventListener("click", () => {
    const found = TEMPLATES.find((t) => t.id === el.dataset.mau);
    if (!found) return;
    state.templateId = found.id;
    state.typeId = found.type;
    save(state); go("soan-noidung");
  }));
  document.querySelectorAll("[data-soan-type]").forEach((el) => el.addEventListener("click", () => {
    state.typeId = el.dataset.soanType;
    state.templateId = TYPE_TEMPLATE[state.typeId];
    save(state); go("soan-noidung");
  }));
  document.querySelectorAll("[data-xem-type]").forEach((el) => el.addEventListener("click", () => {
    state.typeId = el.dataset.xemType;
    state.templateId = TYPE_TEMPLATE[state.typeId];
    save(state); go("xem-preview");
  }));
  document.querySelectorAll("[data-theme]").forEach((el) => el.addEventListener("click", () => {
    state.theme = el.dataset.theme;
    save(state); render();
  }));
  const saveBtn = document.getElementById("saveDraft");
  if (saveBtn) saveBtn.onclick = () => {
    state.name = document.getElementById("f-name").value.trim();
    state.headline = document.getElementById("f-headline").value.trim();
    state.lead = document.getElementById("f-lead").value.trim();
    state.price = document.getElementById("f-price").value.trim();
    state.cta = document.getElementById("f-cta").value.trim();
    state.phone = document.getElementById("f-phone").value.trim();
    state.savedTypes = state.savedTypes || {};
    state.savedTypes[state.typeId] = state.name || typeInfo().name;
    save(state);
    go("xem-preview");
  };
  const saveProfile = document.getElementById("saveProfile");
  if (saveProfile) saveProfile.onclick = () => {
    state.userName = document.getElementById("f-user").value.trim() || "Khách";
    state.birthday = document.getElementById("f-birthday").value;
    save(state);
    const msg = document.getElementById("profileMsg");
    if (msg) msg.textContent = "Đã lưu hồ sơ.";
  };
  const chatForm = document.getElementById("chatForm");
  if (chatForm) chatForm.onsubmit = (e) => {
    e.preventDefault();
    const input = document.getElementById("chatInput");
    const text = input.value.trim();
    if (!text) return;
    state.messages.push({ who: "me", text });
    state.messages.push({ who: "bot", text: "Đã nhận. Nội dung được lưu trên GitHub Pages (trình duyệt của bạn)." });
    save(state); render();
  };
  const apk = document.getElementById("dlApk");
  if (apk) {
    const url = resolveApkUrl();
    apk.href = url;
    apk.onclick = (e) => {
      e.preventDefault();
      fetch(url).then((r) => { if (!r.ok) throw new Error("missing"); return r.blob(); })
        .then((blob) => {
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "WebStudio.apk";
          a.click();
        })
        .catch(() => {
          const hint = document.getElementById("dlHint");
          if (hint) hint.textContent = "Chưa có WebStudio.apk trên GitHub. Hãy tải file APK lên cùng thư mục với index.html.";
        });
    };
  }
}

function renderTabs(active) {
  document.getElementById("tabbar").innerHTML = TABS.map((tab) => `
    <button type="button" class="app-tab${tab.id === active ? " is-on" : ""}" data-go="${tab.id}">
      <span class="app-tab-icon">${ICONS[tab.id]}</span>${tab.label}
    </button>`).join("");
}

function render() {
  const { view, tab } = route();
  document.getElementById("phone").dataset.theme = state.theme;
  document.getElementById("phoneBody").className = "app-phone-body" + (view === "chat" ? " is-chat" : "");
  const views = {
    home: renderHome, mau: renderMau, soan: renderSoan, "soan-noidung": renderSoanNoidung,
    chat: renderChat, xem: renderXem, "xem-preview": renderXemPreview,
    toi: renderToi, "ho-so": renderHoSo, "giao-dien": renderGiaoDien,
    "quyen-rieng-tu": renderQuyen, "tai-khoan": renderTaiKhoan,
    "nha-phat-trien": renderDev, "gioi-thieu": renderAbout, "tai-apk": renderTaiApk
  };
  document.getElementById("phoneBody").innerHTML = (views[view] || renderHome)();
  renderTabs(tab);
  bind();
}

window.addEventListener("hashchange", render);
render();
  </script>
</body>
</html>
